[project]
name = "aegis-guard"
version = "0.1.0"
description = "Inverse proxy and AI evaluator"
authors = [
    {name = "dariogarciagomez01",email = "dariogarciagomez01@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "lancedb (>=0.34.0,<0.35.0)",
    "numpy (>=2.5.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
